name: Go Unit Test

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:

  test-and-lint:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go 1.26.x
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: '1.26.x'
        cache: true

    - name: Test sshpiper (root module)
      run: go test -v -race -cover -tags full ./...

    - name: Test sshpiperd daemon module
      run: go test -v -race -cover ./...
      working-directory: cmd/sshpiperd

    - name: golangci-lint (root module)
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
          args: --timeout=60m --verbose --print-resources-usage --build-tags full -D errcheck
      env:
        GOGC: "10"

    - name: golangci-lint (sshpiperd daemon module)
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
          args: --timeout=60m --verbose --print-resources-usage -D errcheck
          working-directory: cmd/sshpiperd
      env:
        GOGC: "10"

 
    # test go releaser
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Setup Snap
      run: |
        set -e
        sudo snap install snapcraft --classic --revision 11040
        # https://github.com/goreleaser/goreleaser/pull/2117
        mkdir -p $HOME/.cache/snapcraft/download
        mkdir -p $HOME/.cache/snapcraft/stage-packages   

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        distribution: goreleaser
        version: latest
        args: release --snapshot --clean
      env:
        SKIP_PUSH: "true"
